version: '3.8'

services:
  # -----------------------------------------------------------
  # Base de Datos: PostgreSQL 16 (Ligera con Alpine)
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svsoluciones_erp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # -----------------------------------------------------------
  # Cliente Visual: pgAdmin 4 (Acceso web a la BD)
  # -----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: erp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@svsoluciones-erp.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  # Volumen persistente: Para no perder los datos si apagas el contenedor
  postgres_data: